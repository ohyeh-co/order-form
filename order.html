<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>訂購單</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f4;
      --panel: #ffffff;
      --text: #1f2933;
      --muted: #65707d;
      --line: #d9e0dc;
      --accent: #236c62;
      --accent-dark: #174d46;
      --danger: #a33b3b;
      --soft: #eef7f5;
      --shadow: 0 18px 48px rgba(31, 41, 51, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        linear-gradient(135deg, rgba(35, 108, 98, 0.11), transparent 38%),
        linear-gradient(315deg, rgba(195, 94, 67, 0.10), transparent 34%),
        var(--bg);
      color: var(--text);
    }

    main {
      width: min(100% - 32px, 1100px);
      margin: 0 auto;
      padding: 48px 0;
    }

    .form-shell {
      overflow: hidden;
      border: 1px solid rgba(217, 224, 220, 0.9);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .form-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 28px clamp(20px, 4vw, 40px);
      border-bottom: 1px solid var(--line);
      background: #fbfcfb;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: 0;
    }

    .tag {
      flex: 0 0 auto;
      min-width: 96px;
      padding: 8px 12px;
      border: 1px solid #bdd4cf;
      border-radius: 999px;
      color: var(--accent-dark);
      background: var(--soft);
      font-size: 0.9rem;
      text-align: center;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .manage-link {
      min-height: 36px;
      padding: 8px 12px;
      border: 1px solid #cbd5d1;
      border-radius: 6px;
      color: #394650;
      background: #ffffff;
      font-size: 0.9rem;
      font-weight: 800;
      text-decoration: none;
    }

    .manage-link:hover {
      border-color: var(--accent);
      color: var(--accent-dark);
    }

    form {
      padding: clamp(20px, 4vw, 40px);
    }

    .top-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 22px 20px;
      margin-bottom: 28px;
    }

    .field {
      min-width: 0;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #34404a;
      font-size: 0.96rem;
      font-weight: 700;
    }

    input,
    textarea {
      width: 100%;
      min-height: 48px;
      border: 1px solid #cbd5d1;
      border-radius: 6px;
      padding: 12px 14px;
      color: var(--text);
      background: #ffffff;
      font: inherit;
      line-height: 1.45;
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }

    input:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(35, 108, 98, 0.14);
      outline: none;
    }

    input::placeholder,
    textarea::placeholder {
      color: #8a949e;
    }

    input[type="number"] {
      appearance: textfield;
    }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      margin: 0;
      appearance: none;
    }

    textarea {
      min-height: 104px;
      resize: vertical;
    }

    .hint {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 0.84rem;
      line-height: 1.4;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 12px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 1.16rem;
      line-height: 1.3;
      letter-spacing: 0;
    }

    .section-title span {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .line-items {
      display: grid;
      gap: 10px;
    }

    .line-header,
    .line-row {
      display: grid;
      grid-template-columns: 56px minmax(220px, 1.5fr) minmax(112px, 0.55fr) minmax(112px, 0.55fr) minmax(190px, 1fr);
      gap: 10px;
      align-items: center;
    }

    .line-header {
      padding: 0 8px;
      color: #52606d;
      font-size: 0.84rem;
      font-weight: 800;
    }

    .line-row {
      padding: 10px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfb;
    }

    .line-number {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 6px;
      color: var(--accent-dark);
      background: var(--soft);
      font-weight: 800;
    }

    .line-row input {
      min-height: 42px;
      padding: 9px 11px;
    }

    .mobile-label {
      display: none;
      margin-bottom: 6px;
      color: #52606d;
      font-size: 0.78rem;
      font-weight: 800;
    }

    .order-note {
      margin-top: 24px;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }

    .actions button {
      min-height: 46px;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 11px 18px;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      transition: transform 0.14s ease, box-shadow 0.14s ease, background-color 0.14s ease;
    }

    .actions button:active {
      transform: translateY(1px);
    }

    .secondary {
      border-color: #cbd5d1;
      color: #394650;
      background: #ffffff;
    }

    .primary {
      color: #ffffff;
      background: var(--accent);
      box-shadow: 0 10px 22px rgba(35, 108, 98, 0.22);
    }

    .primary:hover {
      background: var(--accent-dark);
    }

    .required {
      color: var(--danger);
    }

    @media (max-width: 900px) {
      .line-header {
        display: none;
      }

      .line-row {
        grid-template-columns: 44px 1fr 1fr;
        align-items: start;
      }

      .line-row .item-field,
      .line-row .note-field {
        grid-column: 2 / -1;
      }

      .mobile-label {
        display: block;
      }
    }

    @media (max-width: 720px) {
      main {
        width: min(100% - 20px, 620px);
        padding: 20px 0;
      }

      .form-header,
      .section-title {
        align-items: flex-start;
        flex-direction: column;
        gap: 12px;
      }

      .header-actions {
        align-items: flex-start;
        flex-direction: column;
      }

      .tag {
        min-width: 0;
      }

      .top-grid,
      .line-row {
        grid-template-columns: 1fr;
      }

      .line-row .item-field,
      .line-row .note-field {
        grid-column: auto;
      }

      .line-number {
        width: 100%;
        justify-content: start;
        padding: 0 12px;
        place-items: center start;
      }

      .actions {
        flex-direction: column-reverse;
      }

      .actions button {
        width: 100%;
      }
    }
  </style>
</head>

  <script>
    const defaultCustomers = [
      { name: "好好藥局", address: "台北市中山區南京東路100號", taxId: "12345678", phone: "02-2345-6789", note: "王小明負責" },
      { name: "啄木鳥藥局", address: "新北市板橋區文化路88號", taxId: "23456789", phone: "02-3456-7890", note: "王小明負責" },
      { name: "新高橋桃園站前", address: "桃園市中壢區中央西路66號", taxId: "34567890", phone: "03-456-7890", note: "王小明負責" },
      { name: "新高橋高雄博愛", address: "台中市西區公益路168號", taxId: "45678901", phone: "04-2345-6789", note: "陳怡君負責" },
      { name: "新高橋楠梓", address: "高雄市苓雅區三多二路99號", taxId: "56789012", phone: "07-345-6789", note: "陳怡君負責" }
    ];

    const defaultItems = [
      { name: "經典原味餅乾", code: "BIS-001" },
      { name: "巧克力夾心餅乾", code: "BIS-002" },
      { name: "蜂蜜燕麥棒", code: "BAR-101" },
      { name: "綜合堅果禮盒", code: "NUT-201" },
      { name: "冷泡茶包", code: "TEA-301" },
      { name: "濾掛咖啡", code: "COF-401" },
      { name: "水果軟糖", code: "CAN-501" },
      { name: "海鹽洋芋片", code: "CHP-601" },
      {name:"健立明膠囊食品",code:"CAL"},
    ];

    function loadRecords(key, fallback) {
      try {
        const records = JSON.parse(localStorage.getItem(key));
        return Array.isArray(records) && records.length ? records : fallback;
      } catch {
        return fallback;
      }
    }

    const customers = loadRecords("orderFormCustomers", defaultCustomers);
    const items = loadRecords("orderFormItems", defaultItems);

    const customerOptions = document.querySelector("#customerOptions");
    const itemOptions = document.querySelector("#itemOptions");

    function updateCustomerOptions() {
      customerOptions.innerHTML = "";
      customers.forEach((customer) => {
        const option = document.createElement("option");
        option.value = customer.name;
        option.label = [customer.phone, customer.address].filter(Boolean).join(" / ");
        customerOptions.append(option);
      });
    }

    function updateItemOptions() {
      itemOptions.innerHTML = "";
      items.forEach((item) => {
        const option = document.createElement("option");
        option.value = item.name;
        option.label = item.code;
        itemOptions.append(option);
      });
    }

    updateCustomerOptions();
    updateItemOptions();
  </script>
