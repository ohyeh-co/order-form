<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>下拉選單管理</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f4;
      --panel: #ffffff;
      --text: #1f2933;
      --muted: #65707d;
      --line: #d9e0dc;
      --accent: #236c62;
      --accent-dark: #174d46;
      --danger: #a33b3b;
      --soft: #eef7f5;
      --shadow: 0 18px 48px rgba(31, 41, 51, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        linear-gradient(135deg, rgba(35, 108, 98, 0.11), transparent 38%),
        linear-gradient(315deg, rgba(195, 94, 67, 0.10), transparent 34%),
        var(--bg);
      color: var(--text);
    }

    main {
      width: min(100% - 32px, 1120px);
      margin: 0 auto;
      padding: 48px 0;
    }

    .shell {
      overflow: hidden;
      border: 1px solid rgba(217, 224, 220, 0.9);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 28px clamp(20px, 4vw, 40px);
      border-bottom: 1px solid var(--line);
      background: #fbfcfb;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 4vw, 2.6rem);
      line-height: 1.15;
      letter-spacing: 0;
    }

    .back-link {
      min-height: 36px;
      padding: 8px 12px;
      border: 1px solid #cbd5d1;
      border-radius: 6px;
      color: #394650;
      background: #ffffff;
      font-size: 0.9rem;
      font-weight: 800;
      text-decoration: none;
    }

    .content {
      padding: clamp(20px, 4vw, 40px);
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }

    .tab {
      min-height: 42px;
      border: 0;
      border-bottom: 3px solid transparent;
      padding: 10px 16px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
    }

    .tab.is-active {
      border-color: var(--accent);
      color: var(--accent-dark);
    }

    .panel {
      display: none;
    }

    .panel.is-active {
      display: block;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin-bottom: 22px;
    }

    .field {
      min-width: 0;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #34404a;
      font-size: 0.94rem;
      font-weight: 800;
    }

    input,
    textarea {
      width: 100%;
      min-height: 46px;
      border: 1px solid #cbd5d1;
      border-radius: 6px;
      padding: 11px 13px;
      color: var(--text);
      background: #ffffff;
      font: inherit;
      line-height: 1.45;
    }

    textarea {
      min-height: 92px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(35, 108, 98, 0.14);
      outline: none;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: 26px;
    }

    button {
      min-height: 42px;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 10px 15px;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
    }

    .primary {
      color: #ffffff;
      background: var(--accent);
    }

    .secondary {
      border-color: #cbd5d1;
      color: #394650;
      background: #ffffff;
    }

    .danger {
      color: #ffffff;
      background: var(--danger);
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    table {
      width: 100%;
      min-width: 820px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      color: #52606d;
      background: #fbfcfb;
      font-size: 0.86rem;
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .row-actions {
      display: flex;
      gap: 8px;
      white-space: nowrap;
    }

    .empty {
      padding: 22px;
      color: var(--muted);
      text-align: center;
    }

    .required {
      color: var(--danger);
    }

    @media (max-width: 760px) {
      main {
        width: min(100% - 20px, 620px);
        padding: 20px 0;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .tabs,
      .actions {
        flex-direction: column;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      button,
      .back-link {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="shell">
      <header>
        <h1>下拉選單管理</h1>
        <a class="back-link" href="order-form.html">返回訂購單</a>
      </header>

      <div class="content">
        <div class="tabs" role="tablist" aria-label="管理類型">
          <button class="tab is-active" type="button" data-target="customersPanel">客戶管理</button>
          <button class="tab" type="button" data-target="itemsPanel">品項管理</button>
        </div>

        <section id="customersPanel" class="panel is-active">
          <form id="customerForm">
            <input id="customerId" type="hidden">
            <div class="form-grid">
              <div class="field">
                <label for="customerName">客戶名稱 <span class="required">*</span></label>
                <input id="customerName" required placeholder="請輸入客戶名稱">
              </div>
              <div class="field">
                <label for="customerTaxId">統編</label>
                <input id="customerTaxId" inputmode="numeric" placeholder="請輸入統一編號">
              </div>
              <div class="field">
                <label for="customerPhone">電話</label>
                <input id="customerPhone" type="tel" placeholder="請輸入電話">
              </div>
              <div class="field full">
                <label for="customerAddress">地址</label>
                <input id="customerAddress" placeholder="請輸入地址">
              </div>
              <div class="field full">
                <label for="customerNote">備註</label>
                <textarea id="customerNote" placeholder="例如：負責業務名稱、付款條件、送貨需求"></textarea>
              </div>
            </div>
            <div class="actions">
              <button class="secondary" type="reset">清除</button>
              <button class="primary" type="submit">新增 / 儲存客戶</button>
            </div>
          </form>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>客戶名稱</th>
                  <th>地址</th>
                  <th>統編</th>
                  <th>電話</th>
                  <th>備註</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="customerRows"></tbody>
            </table>
          </div>
        </section>

        <section id="itemsPanel" class="panel">
          <form id="itemForm">
            <input id="itemId" type="hidden">
            <div class="form-grid">
              <div class="field">
                <label for="itemName">品名 <span class="required">*</span></label>
                <input id="itemName" required placeholder="請輸入品名">
              </div>
              <div class="field">
                <label for="itemCode">代碼</label>
                <input id="itemCode" placeholder="請輸入代碼">
              </div>
            </div>
            <div class="actions">
              <button class="secondary" type="reset">清除</button>
              <button class="primary" type="submit">新增 / 儲存品項</button>
            </div>
          </form>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>品名</th>
                  <th>代碼</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="itemRows"></tbody>
            </table>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script>
    function createId() {
      return crypto.randomUUID ? crypto.randomUUID() : `id-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    const defaultCustomers = [
      { id: createId(), name: "宏達食品", address: "台北市中山區南京東路100號", taxId: "12345678", phone: "02-2345-6789", note: "王小明負責" },
      { id: createId(), name: "佳佳商行", address: "新北市板橋區文化路88號", taxId: "23456789", phone: "02-3456-7890", note: "王小明負責" },
      { id: createId(), name: "新光餐飲", address: "台中市西區公益路168號", taxId: "45678901", phone: "04-2345-6789", note: "陳怡君負責" }
    ];

    const defaultItems = [
      { id: createId(), name: "經典原味餅乾", code: "BIS-001" },
      { id: createId(), name: "巧克力夾心餅乾", code: "BIS-002" },
      { id: createId(), name: "蜂蜜燕麥棒", code: "BAR-101" },
      { id: createId(), name: "濾掛咖啡123", code: "COF-401" },
      { id: createId(), name: "健立明賜立康膠囊",code:"CAL1"}


    ];

    const customerKey = "orderFormCustomers";
    const itemKey = "orderFormItems";

    const customerForm = document.querySelector("#customerForm");
    const itemForm = document.querySelector("#itemForm");
    const customerRows = document.querySelector("#customerRows");
    const itemRows = document.querySelector("#itemRows");
    const customerFields = {
      id: document.querySelector("#customerId"),
      name: document.querySelector("#customerName"),
      address: document.querySelector("#customerAddress"),
      taxId: document.querySelector("#customerTaxId"),
      phone: document.querySelector("#customerPhone"),
      note: document.querySelector("#customerNote")
    };
    const itemFields = {
      id: document.querySelector("#itemId"),
      name: document.querySelector("#itemName"),
      code: document.querySelector("#itemCode")
    };

    function loadRecords(key, fallback) {
      try {
        const records = JSON.parse(localStorage.getItem(key));
        return Array.isArray(records) ? records : fallback;
      } catch {
        return fallback;
      }
    }

    function saveRecords(key, records) {
      localStorage.setItem(key, JSON.stringify(records));
    }

    let customers = loadRecords(customerKey, defaultCustomers);
    let items = loadRecords(itemKey, defaultItems);

    if (!localStorage.getItem(customerKey)) saveRecords(customerKey, customers);
    if (!localStorage.getItem(itemKey)) saveRecords(itemKey, items);

    function cell(text) {
      const td = document.createElement("td");
      td.textContent = text || "";
      return td;
    }

    function renderCustomers() {
      customerRows.innerHTML = "";

      if (!customers.length) {
        customerRows.innerHTML = '<tr><td class="empty" colspan="6">目前沒有客戶資料</td></tr>';
        return;
      }

      customers.forEach((customer) => {
        const tr = document.createElement("tr");
        const actions = document.createElement("td");
        const editButton = document.createElement("button");
        const deleteButton = document.createElement("button");

        editButton.className = "secondary";
        editButton.type = "button";
        editButton.textContent = "修改";
        editButton.addEventListener("click", () => editCustomer(customer.id));

        deleteButton.className = "danger";
        deleteButton.type = "button";
        deleteButton.textContent = "刪除";
        deleteButton.addEventListener("click", () => deleteCustomer(customer.id));

        actions.className = "row-actions";
        actions.append(editButton, deleteButton);
        tr.append(cell(customer.name), cell(customer.address), cell(customer.taxId), cell(customer.phone), cell(customer.note), actions);
        customerRows.append(tr);
      });
    }

    function renderItems() {
      itemRows.innerHTML = "";

      if (!items.length) {
        itemRows.innerHTML = '<tr><td class="empty" colspan="3">目前沒有品項資料</td></tr>';
        return;
      }

      items.forEach((item) => {
        const tr = document.createElement("tr");
        const actions = document.createElement("td");
        const editButton = document.createElement("button");
        const deleteButton = document.createElement("button");

        editButton.className = "secondary";
        editButton.type = "button";
        editButton.textContent = "修改";
        editButton.addEventListener("click", () => editItem(item.id));

        deleteButton.className = "danger";
        deleteButton.type = "button";
        deleteButton.textContent = "刪除";
        deleteButton.addEventListener("click", () => deleteItem(item.id));

        actions.className = "row-actions";
        actions.append(editButton, deleteButton);
        tr.append(cell(item.name), cell(item.code), actions);
        itemRows.append(tr);
      });
    }

    function editCustomer(id) {
      const customer = customers.find((record) => record.id === id);
      if (!customer) return;
      customerFields.id.value = customer.id;
      customerFields.name.value = customer.name || "";
      customerFields.address.value = customer.address || "";
      customerFields.taxId.value = customer.taxId || "";
      customerFields.phone.value = customer.phone || "";
      customerFields.note.value = customer.note || "";
      customerFields.name.focus();
    }

    function deleteCustomer(id) {
      if (!confirm("確定要刪除這筆客戶資料嗎？")) return;
      customers = customers.filter((record) => record.id !== id);
      saveRecords(customerKey, customers);
      renderCustomers();
      customerForm.reset();
      customerFields.id.value = "";
    }

    function editItem(id) {
      const item = items.find((record) => record.id === id);
      if (!item) return;
      itemFields.id.value = item.id;
      itemFields.name.value = item.name || "";
      itemFields.code.value = item.code || "";
      itemFields.name.focus();
    }

    function deleteItem(id) {
      if (!confirm("確定要刪除這筆品項資料嗎？")) return;
      items = items.filter((record) => record.id !== id);
      saveRecords(itemKey, items);
      renderItems();
      itemForm.reset();
      itemFields.id.value = "";
    }

    customerForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const record = {
        id: customerFields.id.value || createId(),
        name: customerFields.name.value.trim(),
        address: customerFields.address.value.trim(),
        taxId: customerFields.taxId.value.trim(),
        phone: customerFields.phone.value.trim(),
        note: customerFields.note.value.trim()
      };

      customers = customers.some((customer) => customer.id === record.id)
        ? customers.map((customer) => customer.id === record.id ? record : customer)
        : [...customers, record];

      saveRecords(customerKey, customers);
      customerForm.reset();
      customerFields.id.value = "";
      renderCustomers();
    });

    itemForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const record = {
        id: itemFields.id.value || createId(),
        name: itemFields.name.value.trim(),
        code: itemFields.code.value.trim()
      };

      items = items.some((item) => item.id === record.id)
        ? items.map((item) => item.id === record.id ? record : item)
        : [...items, record];

      saveRecords(itemKey, items);
      itemForm.reset();
      itemFields.id.value = "";
      renderItems();
    });

    customerForm.addEventListener("reset", () => {
      customerFields.id.value = "";
    });

    itemForm.addEventListener("reset", () => {
      itemFields.id.value = "";
    });

    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach((button) => button.classList.remove("is-active"));
        document.querySelectorAll(".panel").forEach((panel) => panel.classList.remove("is-active"));
        tab.classList.add("is-active");
        document.querySelector(`#${tab.dataset.target}`).classList.add("is-active");
      });
    });

    renderCustomers();
    renderItems();
  </script>
</body>
</html>
